version: '3.8'

services:
  api:
    build:
      context: .
      target: local
    container_name: "mcshop_api"
    ports:
      - "8081:8081"
    volumes:
      - ./:/app
    depends_on:
      - auth-db
      - product-db
      - redis
      - localstack
    networks:
      - mcshop-network

  localstack:
    container_name: "mcshop_localstack"
    image: localstack/localstack:3.2.0
    ports:
      - "127.0.0.1:4510-4559:4510-4559"  # external service port range
      - "127.0.0.1:4566:4566"            # LocalStack Edge Proxy
    environment:
      - LOCALSTACK_HOST=localstack
      - SERVICES=sns,sqs,secretsmanager
      - AWS_DEFAULT_REGION=ap-east-1
    volumes:
      - "./data/localstack/init:/etc/localstack/init/ready.d"
      - "./data/tmp/localstack/volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - mcshop-network

  auth-db:
    image: mysql:8.0
    container_name: "mcshop_auth_mysql"
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_USER=local
      - MYSQL_PASSWORD=local
      - MYSQL_DATABASE=mcshop_auth
    volumes:
      - auth_db_data:/var/lib/mysql
      - ./data/mysql/init/mcshop_auth.sql:/docker-entrypoint-initdb.d/mcshop_auth.sql
    networks:
      - mcshop-network

  product-db:
    image: mysql:8.0
    container_name: "mcshop_product_mysql"
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_USER=local
      - MYSQL_PASSWORD=local
      - MYSQL_DATABASE=mcshop_product
    volumes:
      - product_db_data:/var/lib/mysql
      - ./data/mysql/init/mcshop_product.sql:/docker-entrypoint-initdb.d/mcshop_product.sql
    networks:
      - mcshop-network

  redis:
    restart: always
    image: redis
    container_name: "mcshop_redis"
    ports:
      - "6379:6379"
    networks:
      - mcshop-network

volumes:
  auth_db_data:
  product_db_data:

networks:
  mcshop-network:
    driver: bridge