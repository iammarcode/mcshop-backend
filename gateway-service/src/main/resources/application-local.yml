spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/user/**
        - id: product-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/product/**
        - id: order-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/order/**
        
  datasource:
    url: jdbc:localhost://mcshop-db/mcshop
  data:
    redis:
      host: localhost