spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-route
          uri: http://user-service:8082
          predicates:
            - Path=/api/v1/user/**
        - id: chat-service-route
          uri: http://chat-service:8083
          predicates:
            - Path=/api/v1/chat/**
        - id: subscription-service-route
          uri: http://subscription-service:8084
          predicates:
            - Path=/api/v1/subscription/**
        - id: payment-service-route
          uri: http://payment-service:8085
          predicates:
            - Path=/api/v1/payment/**
  datasource:
    url: jdbc:mysql://mcshop-db/mcshop
  data:
    redis:
      host: redis